name: Production Anime Torrent Scraper

on:
  schedule:
    # Executes automatically once a day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Retains the manual "Run workflow" trigger in the Actions tab

# Set explicit, minimal security permissions for the GitHub token
permissions:
  contents: read

# Prevent concurrent runs of the scraper from stepping on each other's toes
# If a manual run is triggered while the scheduled run is active, the active run is preserved
concurrency:
  group: anime-torrent-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    name: Execute Scraper Engine
    runs-on: ubuntu-latest
    
    # Avoid stuck jobs wasting action minutes (the scraping run should take < 5 minutes)
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize Python 3.10 with Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Leverages GitHub's native pip dependency caching
          cache-dependency-path: 'requirements.txt'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Scraping and Sync Pipeline
        id: scrape_step
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        # Redirect outputs to both the console and a diagnostics log file
        run: |
          python scraper.py 2>&1 | tee scraper_execution.log

      - name: Publish Step Summary
        if: always()
        run: |
          echo "### 🚀 Scraper Job Completed" >> $GITHUB_STEP_SUMMARY
          echo "This run completed with status: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "Execution timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
          
          # Extract the final stats table from the logs if it exists and append it to the step summary UI
          if grep -q "PIPELINE EXECUTION SUMMARY" scraper_execution.log; then
            echo "#### 📊 Pipeline Metrics" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            sed -n '/PIPELINE EXECUTION SUMMARY/,/====/p' scraper_execution.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Debug Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-execution-failure-logs
          path: scraper_execution.log
          retention-days: 7 # Kept for a short period to save space on your GitHub quota
