name: Production Anime Torrent Scraper

on:
  schedule:
    # Triggers automatically twice a day (Every 12 hours: 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Interactive panel for manually triggered syncs or backfills
    inputs:
      historical_mode:
        description: 'Run Historical Backfill Mode (true / false)'
        required: false
        default: 'false'
      max_pages:
        description: 'Historical page limit (each page holds 75 torrents)'
        required: false
        default: '30'
      min_seeders:
        description: 'Only store historical torrents with at least this many seeders'
        required: false
        default: '10'

permissions:
  contents: read

concurrency:
  group: anime-torrent-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    name: Execute Scraper Engine
    runs-on: ubuntu-latest
    
    # Prevents hung runs from consuming unnecessary action minutes
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize Python 3.10 with Dependency Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Scraping and Sync Pipeline
        id: scrape_step
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # Map GitHub Actions inputs or fall back to default values for scheduled runs
          HISTORICAL_MODE: ${{ github.event.inputs.historical_mode || 'false' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          MIN_SEEDERS: ${{ github.event.inputs.min_seeders || '10' }}
        run: |
          python scraper.py 2>&1 | tee scraper_execution.log

      - name: Publish Step Summary to Action Dashboard
        if: always()
        run: |
          echo "### 🚀 Scraper Job Completed" >> $GITHUB_STEP_SUMMARY
          echo "This run completed with status: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "Execution mode: **Historical Mode: ${{ github.event.inputs.historical_mode || 'false' }}**" >> $GITHUB_STEP_SUMMARY
          echo "Execution timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
          
          # Extracts print summary from log files and appends it to the workflow overview
          if grep -q "PIPELINE EXECUTION SUMMARY" scraper_execution.log; then
            echo "#### 📊 Pipeline Metrics" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            sed -n '/PIPELINE EXECUTION SUMMARY/,/====/p' scraper_execution.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Debug Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-execution-failure-logs
          path: scraper_execution.log
          retention-days: 7
